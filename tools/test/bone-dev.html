<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../anatomy/assets/atlas.css">
<style>body{margin:0;background:#fff}#v{width:800px;height:800px}</style></head><body>
<div id="v"></div>
<script src="../../anatomy/assets/viewer.js"></script>
<script>
// dev page for placing landmarks: ?b=<part key>[,<context keys>]
const q = new URLSearchParams(location.search), keys = q.get('b').split(',');
const MAN = q.get('m') || '../../anatomy/models/skull-detail/skull-detail.json';
const v = new AtlasViewer(document.getElementById('v'));
v.c.parentElement.querySelector('.hint').remove();
v.load(MAN, keys).then(() => {
  const PAL = ['#d9cfb6', '#88ccee', '#ddcc77', '#cc6677', '#44aa99', '#aa4499', '#99ddff', '#bbcc33'];
  keys.forEach((k, i) => v.setColour(k, q.get('colour') ? PAL[i % PAL.length] : '#d9cfb6'));
  v.fit(q.get('fitall') ? keys : [keys[0]]); window.v = v; window.ready = true; });
// set a view instantly: dir in body frame
window.faceNow = (n, zoom = 1, focus = null) => {
  const h = Math.hypot(n[0], n[1]);
  v.yaw = h > 1e-6 ? Math.atan2(n[0], n[1]) + Math.PI : 0;
  v.pitch = Math.max(-1.45, Math.min(1.45, Math.atan2(n[2], Math.max(h, 1e-6))));
  v.zoom = zoom; v.pan = [0, 0];
  if (focus) { const q = v.toCam(focus); v.pan = [q[0], q[2]]; }
  v.render(0); v.drawMarkers(null);
};
window.pickAt = (x, y) => { const r = v.c.getBoundingClientRect(); return v.pick(r.left + x, r.top + y); };
</script></body></html>
