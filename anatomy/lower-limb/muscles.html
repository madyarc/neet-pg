/* ===================== PAGE (shared logic: ../assets/muscle-page.js) ===================== */
function buildAnkle(api) {
  const {v, focusOn, pressed, clearRows} = api, $ = id => document.getElementById(id);
  const box = $('ankle-list'); box.replaceChildren();
  for (const [k, name, text] of ANKLE.parts) {
    if (!api.has(k)) continue;
    const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<i style="background:var(--fascia)"></i><span>${name}</span>`;
    b.onclick = () => { nvBack(v); clearRows(); pressed('#ankle-list button', x => x === k); $('ankle-desc').innerHTML = `<b>${name}.</b> ${text}`; focusOn([k]); v.fit([k]); };
    box.append(b);
  }
  const rowSel = (row, ks, text, dir) => {
    nvBack(v); clearRows(); pressed('#ankle-list button', () => false); row.setAttribute('aria-pressed', 'true');
    $('ankle-desc').innerHTML = text; focusOn(ks); v.fit(ks.length ? ks : ['tibia', 'calcaneus']); v.face(dir, {zoom: 1});
  };
  const sp = $('spaces');
  sp.innerHTML = ANKLE.spaces.map(([n], i) => `<tr data-k="sp${i}" aria-pressed="false"><td>${n}</td></tr>`).join('');
  sp.querySelectorAll('tr').forEach((r, i) => r.onclick = () => { const S = ANKLE.spaces[i]; rowSel(r, S[1], `<b>${S[0]}.</b> ${S[2]}`, [0.3, -1, 0.1]); });
  const tun = $('tunnel');

/* leave a vessel topic: hide its parts, show the fascia parts of this tab again */
function nvBack(v) { nvOff(v); for (const k of ANKLE.parts.map(p => p[0])) if (v.parts.has(k)) v.setVisible(k, true); }
/* in a vessel topic the muscles are drawn plain (--soft) so the vessels stand out; their own colours come back after */
const nvSaved = {};
function nvMuscles(v, solid) {
  for (const [k, c] of Object.entries(nvSaved)) { v.setColour(k, c); delete nvSaved[k]; }
  for (const k of solid) if (v.parts.has(k)) { if (!(k in nvSaved)) nvSaved[k] = v.parts.get(k).colour; v.setColour(k, '--soft'); }
}
/* ----- vessels, nerves, lymph nodes: parts fetched from the whole-body packs on first use ----- */
const NV_KEYS = [...new Set(NV.topics.flatMap(t => t.parts))];
const NV_SET = new Set(NV_KEYS);
const NV_LAYER = k => k.startsWith('v_') ? ['../models/body-vessels/', 'body-vessels.json'] : k.startsWith('n_') ? ['../models/body-nerves/', 'body-nerves.json']
  : k.startsWith('l_') ? ['../models/body-lymph/', 'body-lymph.json'] : k.includes('bursa') ? ['../models/ll-joints/', 'll-joints.json'] : ['../models/ax-joints/', 'ax-joints.json'];
const NV_COLOUR = k => k.startsWith('v_') ? (/vein/.test(k) ? '--vein' : '--artery') : k.startsWith('n_') ? '--nerve' : k.startsWith('l_') ? '--lymph' : k.includes('bursa') ? '--bursa' : '--lig';
let nvTopic = null, nvQueue = Promise.resolve();
const nvMans = {};
const isNPM = b => b.byteLength > 4 && String.fromCharCode(...new Uint8Array(b, 0, 4)) === 'NPM1';
/* fetch only the needed parts: a byte range of the pack when the server allows it, else the whole pack once */
async function nvFetch(v, keys) {
  const need = keys.filter(k => !v.parts.has(k)), groups = {};
  for (const k of need) { const [b, m] = NV_LAYER(k); (groups[b + m] = groups[b + m] || {base: b, man: m, keys: []}).keys.push(k); }
  for (const g of Object.values(groups)) {
    const man = nvMans[g.base + g.man] = nvMans[g.base + g.man] || await fetch(g.base + g.man).then(r => { if (!r.ok) throw new Error(g.man + ': ' + r.status); return r.json(); });
    const list = man.parts.filter(p => g.keys.includes(p.key));
    if (!list.length) continue;
    const url = g.base + list[0].file;
    let whole = null, ranged = false;
    try {
      const p = list[0], r = await fetch(url, {headers: {Range: `bytes=${p.offset}-${p.offset + p.bytes - 1}`}});
      if (r.status === 206) { const b = await r.arrayBuffer(); ranged = isNPM(b) && b.byteLength === p.bytes; if (ranged) await addBuf(v, p, b); }
      else if (r.ok) whole = await r.arrayBuffer();
    } catch (e) { ranged = false; }
    if (!ranged && !whole) whole = await fetch(url).then(r => r.arrayBuffer());
    const rest = ranged ? list.slice(1) : list;
    const bufs = await Promise.all(rest.map(async p => {
      if (whole) return whole.slice(p.offset, p.offset + p.bytes);
      const r = await fetch(url, {headers: {Range: `bytes=${p.offset}-${p.offset + p.bytes - 1}`}});
      const b = await r.arrayBuffer();
      return r.status === 206 && isNPM(b) ? b : (whole = whole || await fetch(url).then(x => x.arrayBuffer())).slice(p.offset, p.offset + p.bytes);

}
async function addBuf(v, p, buf) {

}
/* a point on a part for its label: the vertex nearest height z (mm), or the centre of its box */
function nvPoint(v, k, z) {
  const p = v.parts.get(k); if (!p) return null;
  if (z == null) return p.bbox[0].map((x, i) => (x + p.bbox[1][i]) / 2);
  const P = p.m.pos, dir = Array.isArray(z) ? z[1] : null; if (dir) z = z[0];
  let best = 0, bd = 1e9;
  for (let i = 0; i < P.length / 3; i++) {   // nearest to height z; with a direction, the outermost vertex within 4 mm of z
    const dz = Math.abs(P[i * 3 + 2] - z), d = dir ? (dz > 4 ? 1e6 + dz : -(P[i * 3] * dir[0] + P[i * 3 + 1] * dir[1] + P[i * 3 + 2] * dir[2])) : dz;
    if (d < bd) { bd = d; best = i; } }

}
function nvOff(v) {

}
function keyPointMarkers(v) {
  const vert = (k, f) => { const p = v.parts.get(k); if (!p) return null; const P = p.m.pos; let b = 0;
    for (let i = 1; i < P.length / 3; i++) if (f(P, i) < f(P, b)) b = i; return [P[b * 3], P[b * 3 + 1], P[b * 3 + 2]]; };
  const pts = {L2: [-53.8, -110, 644], L3: [-35, -73, 429], L4: [-56, -72, 65],
    L5: vert('mt3', (P, i) => P[i * 3 + 1] - 0.3 * P[i * 3 + 2]),       // front (and upper) end of the 3rd metatarsal head
    S1: vert('calcaneus', (P, i) => P[i * 3]),                          // most lateral point of the calcaneus
    S2: [-76, -45, 455], S3: [-67, -48, 781]};

function dermSvg() {

      ${band('--dm-l4', 'M98 152 H200 V340 H98 Z')}${band('--dm-l5', 'M0 152 H98 V290 H0 Z M60 290 H110 V340 H60 Z')}${band('--dm-s1', 'M0 290 H86 V340 H0 Z')}

function buildNV(api) {

  tb.innerHTML = NV.topics.map(t => `<tr data-k="${t.id}" aria-pressed="false"><td>${t.name}</td></tr>`).join('');

function showNV(api, t, row) {
  const {v, clearRows, pressed, focusOn} = api, $ = id => document.getElementById(id);

  nvTopic = t.id;
  $('ankle-desc').innerHTML = `<b>${t.name}.</b> ${t.text}` + (t.parts.length && t.parts.some(k => !v.parts.has(k)) ? ' <span class="note">(loading the vessels and nerves…)</span>' : '');
  $('derm').hidden = !t.derm; if (t.derm && !$('derm').innerHTML) $('derm').innerHTML = dermSvg();

    $('ankle-desc').innerHTML = `<b>${t.name}.</b> ${t.text}`;
    for (const k of NV_KEYS) if (v.parts.has(k)) { const on = t.parts.includes(k); v.setVisible(k, on); if (on) v.setColour(k, NV_COLOUR(k)); }
    for (const k of ANKLE.parts.map(p => p[0])) if (v.parts.has(k)) v.setVisible(k, (t.fascia || []).includes(k));

const PAGE = MusclePage({
