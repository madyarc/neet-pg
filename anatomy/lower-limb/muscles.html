/* ===================== PAGE (shared logic: ../assets/muscle-page.js) ===================== */
function buildAnkle(api) {
  const {v, focusOn, pressed, clearRows} = api, $ = id => document.getElementById(id);
  const box = $('ankle-list'); box.replaceChildren();
  for (const [k, name, text] of ANKLE.parts) {
    if (!api.has(k)) continue;
    const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<i style="background:var(--fascia)"></i><span>${name}</span>`;
    b.onclick = () => { clearRows(); pressed('#ankle-list button', x => x === k); $('ankle-desc').innerHTML = `<b>${name}.</b> ${text}`; focusOn([k]); v.fit([k]); };
    box.append(b);
  }
  const rowSel = (row, ks, text, dir) => {
    clearRows(); pressed('#ankle-list button', () => false); row.setAttribute('aria-pressed', 'true');
    $('ankle-desc').innerHTML = text; focusOn(ks); v.fit(ks.length ? ks : ['tibia', 'calcaneus']); v.face(dir, {zoom: 1});
  };
  const sp = $('spaces');
  sp.innerHTML = ANKLE.spaces.map(([n], i) => `<tr data-k="sp${i}" aria-pressed="false"><td>${n}</td></tr>`).join('');
  sp.querySelectorAll('tr').forEach((r, i) => r.onclick = () => { const S = ANKLE.spaces[i]; rowSel(r, S[1], `<b>${S[0]}.</b> ${S[2]}`, [0.3, -1, 0.1]); });
  const tun = $('tunnel');
  tun.innerHTML = ANKLE.tunnel.map(([n, ks], i) => `<tr data-k="tu${i}" aria-pressed="false"><td>${i + 1}</td><td>${n}</td></tr>`).join('');
  tun.querySelectorAll('tr').forEach((r, i) => r.onclick = () => rowSel(r, ANKLE.tunnel[i][1], `<b>Tarsal tunnel, ${i + 1} of 5:</b> ${ANKLE.tunnel[i][0]}. The tunnel lies under the flexor retinaculum, behind the medial malleolus.`, [1, 0.2, 0.1]));
  const lay = $('layers');
  lay.innerHTML = '<tr><th>Layer</th><th>Contents</th></tr>' + ANKLE.layers.map(([n, ks, t], i) => `<tr data-k="la${i}" aria-pressed="false"><td>${n}</td><td>${t}</td></tr>`).join('');
  lay.querySelectorAll('tr[data-k]').forEach((r, i) => r.onclick = () => { const L = ANKLE.layers[i]; rowSel(r, L[1], `<b>${L[0]} layer of the sole:</b> ${L[2]}. The sole is described in four layers, from the surface inwards.`, [0, 0.2, -1]); });
  const ar = $('arches');
  ar.innerHTML = ANKLE.arches.map(([n, ks, t], i) => `<tr data-k="ar${i}" aria-pressed="false"><td>${n}</td><td>${t}</td></tr>`).join('') + `<tr><td colspan="2" class="note">${ANKLE.archNote}</td></tr>`;
  ar.querySelectorAll('tr[data-k]').forEach((r, i) => r.onclick = () => { const A = ANKLE.arches[i]; rowSel(r, A[1].concat(i === 0 ? ['plantar_apon'] : []), `<b>${A[0]} arch:</b> ${A[2]}.`, [1, 0.3, -0.3]); });
}
MusclePage({
  base: '../models/lower-limb-muscles/', manifest: 'lower-limb-muscles.json', DATA, GROUPS, NERVES, NERVE_TEXT, M,
  extra: {key: 'ankle', parts: ANKLE.parts.map(p => p[0]), build: buildAnkle,
    enter(api) { document.getElementById('ankle-desc').innerHTML = ANKLE.intro; const ks = ANKLE.parts.map(p => p[0]).filter(api.has);
      api.focusOn(ks); api.v.fit(api.LIMB()); api.v.face([0, -1, 0], {zoom: 1}); }},
});
</script>
