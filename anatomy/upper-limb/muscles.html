const NERVE_TEXT = {
  median: 'Supplies the front of the forearm except FCU and the ulnar half of FDP (the deep muscles through its anterior interosseous branch), and in the hand the thenar muscles APB, OP and the superficial head of FPB, and the 1st and 2nd lumbricals. <b>Carpal tunnel syndrome:</b> the nerve is squeezed in the carpal tunnel: pain, numbness and tingling in the thumb, index, middle and lateral half of the ring finger, often worse at night; later weakness and wasting of the thenar muscles.',
  ulnar: 'Supplies FCU and the ulnar half of FDP in the forearm, and in the hand the hypothenar muscles, adductor pollicis, the deep head of FPB, the 3rd and 4th lumbricals and all the interossei. <b>Claw hand:</b> with the ulnar intrinsics lost, the long extensors and flexors act unopposed: the MCP joints hyperextend and the interphalangeal joints flex, most in the ring and little fingers; the fingers cannot be spread or brought together against resistance. Common sites: the cubital tunnel at the elbow, Guyon\'s canal at the wrist.',
  radial: 'Triceps and anconeus in the arm. In the forearm, brachioradialis and ECRL from the radial nerve itself; ECRB and supinator from its deep branch; all the other extensors of the forearm from the posterior interosseous nerve. <b>Wrist drop:</b> with the radial nerve damaged (e.g. a fracture of the shaft of the humerus, or prolonged pressure), the wrist and finger extensors are paralysed and the wrist hangs flexed. A lesion of the posterior interosseous nerve alone spares wrist extension (ECRL is supplied higher up) but weakens finger and thumb extension.',
  two: 'FDP, the lumbricals and FPB are each supplied partly by the median and partly by the ulnar nerve.',
  musculocutaneous: 'Supplies the three muscles of the front of the arm: coracobrachialis (which it pierces), biceps and brachialis.',
  axillary: 'Passes through the quadrangular space with the posterior circumflex humeral vessels and supplies the deltoid and teres minor. <b>Injury</b> (dislocation of the shoulder, fracture of the upper humerus): weak abduction and wasting of the deltoid.',
  plexus: 'Branches of the brachial plexus to the shoulder girdle: pectoral nerves (pectoralis major and minor), nerve to subclavius, long thoracic nerve (serratus anterior), dorsal scapular nerve (rhomboids), suprascapular nerve (supraspinatus, infraspinatus), thoracodorsal nerve (latissimus dorsi), upper and lower subscapular nerves (subscapularis, teres major). <b>Long thoracic nerve injury:</b> winged scapula.',
  accessory: 'Cranial nerve XI: motor supply of trapezius. <b>Injury</b> in the posterior triangle of the neck: drooping shoulder, weak abduction above 90°, lateral winging of the scapula.',
  cervical: 'C3 and C4 supply levator scapulae (often with the dorsal scapular nerve) and also reach trapezius.',
};
const WRIST = {
  intro: 'At the wrist the deep fascia is thickened into two retinacula, which hold the tendons down. Tap one.',
  parts: [
    ['flexor_ret', 'Flexor retinaculum', 'Attached medially to the pisiform and the hook of the hamate, laterally to the tubercle of the scaphoid and the trapezium. It turns the hollow front of the carpus into the <b>carpal tunnel</b>, which carries the median nerve (just under the retinaculum) and nine tendons: four of FDS, four of FDP and FPL. In front of the retinaculum, not in the tunnel: the ulnar nerve and artery, and the palmaris longus tendon. FCR runs in its own canal in the retinaculum\'s lateral part. The short thenar and hypothenar muscles arise from it.'],
    ['extensor_ret', 'Extensor retinaculum', 'A thickening of the deep fascia on the back of the forearm. Deep to it the extensor tendons run in six compartments (table below).'],
    ['palmar_apon', 'Palmar aponeurosis', 'The deep fascia of the palm: continuous with the flexor retinaculum, it receives the palmaris longus tendon and gives origin to palmaris brevis (a small hypothenar skin muscle, not in this model). <b>Dupuytren\'s contracture:</b> a fibrosing disease of the palmar aponeurosis and the fascia of the fingers: painless nodules, then cords, then fixed flexion of the fingers, most often the ring and little fingers.'],
    ['interosseous_membrane', 'Interosseous membrane', 'Joins the radius and ulna; many deep forearm muscles arise from it (FDP, FPL, APL, EPB, EPL, extensor indicis).'],
  ],
  comps: [
    ['1', ['apl', 'epb'], 'APL, EPB', 'Lateral side of the styloid process of the radius. Inflamed in de Quervain tenosynovitis.'],
    ['2', ['ecrl', 'ecrb'], 'ECRL, ECRB', ''],
    ['3', ['epl'], 'EPL', 'On the ulnar side of the dorsal (Lister\'s) tubercle.'],
    ['4', ['ed', 'ei'], 'ED, EI', ''],
    ['5', ['edm'], 'EDM', 'Over the distal radio-ulnar joint.'],
    ['6', ['ecu'], 'ECU', 'Between the head and the styloid process of the ulna.'],
  ],
  thumb: [
    ['Flexion at the IP joint', ['fpl'], 'FPL', 'median (AIN)'],
    ['Flexion at the MCP joint', ['fpb'], 'FPB', 'median / ulnar'],
    ['Extension at the IP joint', ['epl'], 'EPL', 'PIN'],
    ['Extension at the MCP joint', ['epb', 'epl'], 'EPB (and EPL)', 'PIN'],
    ['Abduction', ['apb', 'apl'], 'APB, APL', 'median; PIN'],
    ['Adduction', ['adductor_pollicis'], 'Adductor pollicis', 'ulnar (deep branch)'],
    ['Opposition', ['op'], 'Opponens pollicis (with help from other short thumb muscles)', 'median (recurrent branch)'],
  ],
};

/* ===================== PAGE ===================== */
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const v = new AtlasViewer(document.getElementById('v'));
v.ghostAlpha = 0.12; window.atlas = v;   // for tests
const card = v.addOverlay(document.createElement('div')); card.className = 'selcard'; card.hidden = true;
let man = null, names = {}, colours = {}, attach = {}, tab = 'muscles', sel = null, group = null;
const isMuscle = k => k in M, isFascia = k => WRIST.parts.some(p => p[0] === k);
const BONES = () => v.order.filter(k => !isMuscle(k) && !isFascia(k));
const LIMB = () => v.order.filter(k => !k.startsWith('ax_'));   /* the limb itself: framing ignores the axial context bones */
const views = [['Front', [0, -1, 0]], ['Lateral', [-1, 0, 0]], ['Back', [0, 1, 0]], ['Medial', [1, 0, 0]]];
for (const [label, dir] of views) {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = label;
  b.onclick = () => v.face(dir, {zoom: v.zoom}); document.getElementById('views').append(b);
}
const pressed = (sel, test) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', test(b.dataset.k)));
const nerveOf = k => M[k] && M[k][3];
const pending = k => !M[k] || M[k].length < 3;

function paint() {
  for (const k of v.order) {
    v.setVertexMarks(k, null);
    if (isMuscle(k)) v.setColour(k, tab === 'nerves' ? (nerveOf(k) ? NERVES[nerveOf(k)][1] : '--line') : (colours[k] || '--line'));
    else if (isFascia(k)) { v.setColour(k, '--fascia'); v.setVisible(k, tab === 'wrist'); }
    else v.setColour(k, '--bone');
  }
}
function focusOn(keys) { v.setFocus(keys ? keys.concat(BONES()) : null); }

/* ---------- muscles tab ---------- */
function showDetail(k) {
  const d = document.getElementById('detail');
  if (!k) {
    d.innerHTML = `<p class="cap key">${group ? `<b>${GROUPS.find(g => g[0] === group)[1]}.</b> Tap a muscle on the model or in the list.` : 'Tap a muscle on the model or in the list, or a group to frame it.'}</p>`;
    return;
  }
  const m = M[k], g = GROUPS.find(x => x[0] === m[0])[1];
  if (pending(k)) { d.innerHTML = `<h2>${names[k]}</h2><p class="sub">${g}</p><p class="pending">The facts for this muscle are still being checked in two sources; they will be added here.</p>`; return; }
  const [, ori, ins, nk, ntext, act, note] = m;
  const hasA = attach[k] && attach[k].length;
  d.innerHTML = `<h2>${names[k]}</h2><p class="sub">${g}</p>
    <dl class="facts">
      <dt><span class="swatch" style="background:var(--ori)"></span>Origin</dt><dd>${ori || '<span class="pending">Left out (only one source).</span>'}</dd>
      <dt><span class="swatch" style="background:var(--ins)"></span>Insertion</dt><dd>${ins || '<span class="pending">Left out (only one source).</span>'}</dd>
      <dt><span class="swatch" style="background:var(${NERVES[nk][1]})"></span>Nerve</dt><dd>${ntext}</dd>
      <dt>Action</dt><dd>${act}</dd>
      ${note ? `<dt>Note</dt><dd>${note}</dd>` : ''}
    </dl>
    <p class="note">${hasA ? 'On the bones: origin in blue, insertion in orange. The areas are approximate, and only those that fit the model well are drawn.' : 'Its attachment areas are not drawn: the model does not show them reliably.'}</p>`;
}
function select(k, frame = false) {
  if (sel && v.parts.has(sel)) v.setVisible(sel, true);
  if (!k) { sel = null; card.hidden = true; pressed('.mlist button', () => false); paint(); focusOn(group ? GROUPS_KEYS(group) : null); showDetail(null); return; }
  sel = k;
  pressed('.mlist button', x => x === k);
  paint();
  const byBone = {};
  for (const a of attach[k] || []) (byBone[a.bone] = byBone[a.bone] || []).push({verts: a.verts, colour: a.kind === 'ori' ? '--ori' : '--ins'});
  for (const b in byBone) v.setVertexMarks(b, byBone[b]);
  focusOn([k]);
  if (frame) { v.fit([k].concat((attach[k] || []).map(a => a.bone))); }
  card.hidden = false;
  const hasA = attach[k] && attach[k].length;
  card.innerHTML = `<div class="what"><b>${names[k]}</b><span>${M[k] ? (tab === 'nerves' ? NERVES[nerveOf(k) || 'two'][0] : GROUPS.find(g => g[0] === M[k][0])[1]) : ''}</span></div>${hasA ? '<button class="go" id="peek" aria-pressed="false">See the bone</button>' : ''}<button class="x" aria-label="Clear">×</button>`;
  card.querySelector('.x').onclick = () => select(null);
  const peek = card.querySelector('#peek');
  if (peek) peek.onclick = () => { const on = peek.getAttribute('aria-pressed') !== 'true'; peek.setAttribute('aria-pressed', on);
    peek.textContent = on ? 'Show the muscle' : 'See the bone'; v.setVisible(k, !on); };
  if (tab === 'muscles') showDetail(k);
}
const GROUPS_KEYS = g => Object.keys(M).filter(k => M[k][0] === g && v.parts.has(k));
function buildGroups() {
  const box = document.getElementById('groups'); box.replaceChildren();
  for (const [g, gname] of GROUPS) {
    const h = document.createElement('button'); h.className = 'group-h'; h.style.cssText = 'background:none;border:0;padding:0;cursor:pointer;text-align:left';
    h.textContent = gname + ' →'; h.onclick = () => { group = g; select(null); const ks = GROUPS_KEYS(g); v.fit(ks); };
    const list = document.createElement('div'); list.className = 'mlist';
    for (const k of GROUPS_KEYS(g)) {
      const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = `<i style="background:${colours[k] || '#999'}"></i>${names[k]}`;
      b.onclick = () => select(k, true);
      list.append(b);
    }
    box.append(h, list);
  }
}

/* ---------- nerves tab ---------- */
function buildNerves() {
  const box = document.getElementById('nerve-list'); box.replaceChildren();
  for (const [nk, [name, tok]] of Object.entries(NERVES)) {
    const ks = Object.keys(M).filter(k => nerveOf(k) === nk && v.parts.has(k));
    if (!ks.length) continue;
    const b = document.createElement('button'); b.dataset.k = nk; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<i style="background:var(${tok})"></i><span>${name}</span><span class="n">${ks.length}</span>`;
    b.onclick = () => {
      pressed('#nerve-list button', x => x === nk); sel = null; card.hidden = true;
      document.getElementById('nerve-desc').innerHTML = `<b>${name}.</b> ${NERVE_TEXT[nk] || ''} <span class="note">Muscles: ${ks.map(k => names[k]).join(', ')}.</span>`;
      focusOn(ks); v.fit(ks);
    };
    box.append(b);
  }
}

/* ---------- wrist tab ---------- */
function buildWrist() {
  const box = document.getElementById('wrist-list'); box.replaceChildren();
  for (const [k, name, text] of WRIST.parts) {
    if (!v.parts.has(k)) continue;
    const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<i style="background:var(--fascia)"></i><span>${name}</span>`;
    b.onclick = () => { clearRows(); pressed('#wrist-list button', x => x === k); document.getElementById('wrist-desc').innerHTML = `<b>${name}.</b> ${text}`; focusOn([k]); v.fit([k]); };
    box.append(b);
  }
  const comp = document.getElementById('comp');
  comp.innerHTML = '<tr><th>No.</th><th>Tendons</th><th>Where</th></tr>' + WRIST.comps.map(([n, ks, t, w]) => `<tr data-k="c${n}" aria-pressed="false"><td>${n}</td><td>${t}</td><td>${w}</td></tr>`).join('');
  const thumb = document.getElementById('thumb');
  thumb.innerHTML = '<tr><th>Movement</th><th>Muscles</th><th>Nerve</th></tr>' + WRIST.thumb.map(([mv, ks, t, n], i) => `<tr data-k="t${i}" aria-pressed="false"><td>${mv}</td><td>${t}</td><td>${n}</td></tr>`).join('');
  const rowSel = (row, ks, text) => {
    clearRows(); pressed('#wrist-list button', () => false); row.setAttribute('aria-pressed', 'true');
    document.getElementById('wrist-desc').innerHTML = text; focusOn(ks); v.fit(ks.concat(['radius', 'ulna'].filter(b => v.parts.has(b)))); v.face([0, 1, 0.2], {zoom: 1});
  };
  comp.querySelectorAll('tr[data-k]').forEach((r, i) => r.onclick = () => { const c = WRIST.comps[i]; rowSel(r, c[1], `<b>Compartment ${c[0]}:</b> ${c[2]}. ${c[3]}`); });
  thumb.querySelectorAll('tr[data-k]').forEach((r, i) => r.onclick = () => { const t = WRIST.thumb[i]; rowSel(r, t[1], `<b>${t[0]}:</b> ${t[2]} (${t[3]}).`); v.face([0, -1, 0], {zoom: 1}); });
}
function clearRows() { document.querySelectorAll('table.t tr[data-k]').forEach(r => r.setAttribute('aria-pressed', 'false')); }

function setTab(name) {
  if (sel && v.parts.has(sel)) v.setVisible(sel, true);
  tab = name; sel = null; group = null; card.hidden = true;
  for (const t of ['muscles', 'nerves', 'wrist']) {
    document.getElementById('tab-' + t).setAttribute('aria-pressed', t === name);
    document.getElementById('pane-' + t).hidden = t !== name;
  }
  pressed('.mlist button, #nerve-list button, #wrist-list button', () => false); clearRows();
  paint(); focusOn(null);
  if (name === 'muscles') { showDetail(null); v.fit(LIMB()); v.face([0, -1, 0], {zoom: 1}); }
  if (name === 'nerves') { document.getElementById('nerve-desc').innerHTML = 'Each muscle is coloured by the nerve that supplies it. Tap a nerve.'; v.fit(LIMB()); v.face([0, -1, 0], {zoom: 1}); }
  if (name === 'wrist') { document.getElementById('wrist-desc').innerHTML = WRIST.intro; const ks = ['flexor_ret', 'extensor_ret', 'palmar_apon'].filter(k => v.parts.has(k)); focusOn(ks); v.fit(ks.concat(['scaphoid', 'hamate', 'mc3'].filter(k => v.parts.has(k)))); v.face([0, -1, 0], {zoom: 1}); }
}
for (const t of ['muscles', 'nerves', 'wrist']) document.getElementById('tab-' + t).onclick = () => setTab(t);
v.onPick = hit => {
  if (!hit) { select(null); return; }
  if (isMuscle(hit.key)) { if (tab === 'wrist') setTab('muscles'); select(hit.key); }
};

(async () => {
  document.getElementById('lede').innerHTML = DATA.lede;
  document.getElementById('based').innerHTML = DATA.based;
  document.getElementById('models').innerHTML = DATA.models;
  const base = '../models/upper-limb-muscles/';
  const [c, a] = await Promise.all([fetch(base + 'colours.json').then(r => r.json()), fetch(base + 'attachments.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))]);
  colours = c.colours; attach = a;
  man = await v.load(base + 'upper-limb-muscles.json');
  for (const p of man.parts) names[p.key] = p.name;
  buildGroups(); buildNerves(); buildWrist();
  setTab('muscles');
  window.ready = true;
})().catch(e => { document.getElementById('detail').textContent = 'Could not load the 3D model: ' + e.message; window.loadError = String(e); });
</script>
</body>
</html>
