<script>
"use strict";
/* ===================== DATA (every fact checked in two sources: anatomy/DATA-SOURCES.md) ===================== */
const HAND = ['scaphoid', 'lunate', 'triquetral', 'pisiform', 'trapezium', 'trapezoid', 'capitate', 'hamate',
  'mc1', 'mc2', 'mc3', 'mc4', 'mc5', 'pp1', 'dp1', 'pp2', 'mp2', 'dp2', 'pp3', 'mp3', 'dp3', 'pp4', 'mp4', 'dp4', 'pp5', 'mp5', 'dp5'];
const LAYERS = [['capsule', 'Capsule', '--capsule'], ['lig', 'Ligaments', '--lig'], ['cart', 'Disc, labrum', '--cart'], ['bursa', 'Bursae', '--bursa']];
// each joint: the bones shown, its soft parts by layer, the examples (3D scenes, some with a movement), and its text
const JOINTS = {
  sc: {name: 'Sternoclavicular', bones: ['manubrium', 'rib1_r', 'cc1_r', 'clavicle'],
    soft: {capsule: ['articular_capsule_of_sternoclavicular_joint'], lig: ['anterior_sternoclavicular_ligament', 'posterior_sternoclavicular_ligament', 'interclavicular_ligament', 'costoclavicular_ligament'], cart: ['articular_disc_of_sternoclavicular_joint']},
    ex: [{name: 'Sternoclavicular joint', motion: 'sternoclavicular', fit: ['manubrium', 'clavicle'], zoom: 1.1, views: [[0, -1, 0.15], [0, -0.05, 1]]}]},
  ac: {name: 'Acromioclavicular', bones: ['clavicle', 'scapula'],
    soft: {capsule: ['articular_capsule_of_acromioclavicular_joint'], lig: ['acromioclavicular_ligament', 'conoid_ligament', 'trapezoid_ligament', 'coraco_acromial_ligament'], cart: ['articular_disc_of_acromioclavicular_joint']},
    ex: [{name: 'Acromioclavicular joint', motion: 'acromioclavicular', fit: ['scapula'], zoom: 1.1, pivotCentre: true, views: [[0, -1, 0.2]]}]},
  shoulder: {name: 'Shoulder', bones: ['scapula', 'clavicle', 'humerus'],
    soft: {capsule: ['articular_capsule_of_glenohumeral_joint'], lig: ['superior_glenohumeral_ligament', 'middle_glenohumeral_ligament', 'inferior_glenohumeral_ligament', 'coracohumeral_ligament', 'transverse_humeral_ligament', 'coraco_acromial_ligament'],
      cart: ['glenoid_labrum'], bursa: ['subacromial_bursa', 'subdeltoid_bursa', 'coracobrachial_bursa', 'subtendinous_bursa_of_infraspinatus_muscle']},
    ex: [{name: 'Shoulder joint', motion: 'shoulder', fit: ['articular_capsule_of_glenohumeral_joint', 'coraco_acromial_ligament'], zoom: 0.55, views: [[-1, 0, 0], [0, -1, 0], [0, -0.3, 1, 0.9]]}]},
  elbow: {name: 'Elbow', bones: ['humerus', 'ulna', 'radius'],
    soft: {capsule: ['articular_capsule_of_elbow_joint'], lig: ['ulnar_collateral_ligament', 'radial_collateral_ligament', 'annular_ligament_of_radius', 'quadrate_ligament'], bursa: ['subtendinous_bursa_of_triceps_brachii_muscle']},
    ex: [{name: 'Elbow joint', motion: 'elbow', fit: ['articular_capsule_of_elbow_joint'], zoom: 0.45, views: [[-1, 0, 0]]}]},
  radioulnar: {name: 'Radio-ulnar', bones: ['humerus', 'ulna', 'radius'],
    soft: {lig: ['annular_ligament_of_radius', 'quadrate_ligament', 'interosseous_membrane_of_forearm', 'oblique_cord', 'palmar_radio_ulnar_ligament', 'dorsal_radio_ulnar_ligament'], cart: ['articular_disc_of_distal_radio_ulnar_joint']},
    ex: [{name: 'Radio-ulnar joints', motion: 'radioulnar', fit: ['radius', 'ulna'], zoom: 1, showHand: true, views: [[0, -1, 0.1]]}]},
  wrist: {name: 'Wrist', title: 'Wrist and carpus', bones: ['radius', 'ulna'].concat(HAND),
    soft: {capsule: ['articular_capsule_of_radiocarpal_joint'], lig: ['radial_collateral_ligament_of_wrist_joint', 'ulnar_collateral_ligament_of_wrist_joint', 'dorsal_radiocarpal_ligament', 'radioscaphocapitate_ligament', 'ulnocapitate_ligament', 'ulnolunate_ligament', 'ulnotriquetral_ligament', 'dorsal_ulnocarpal_ligament', 'radiate_carpal_ligament', 'dorsal_intercarpal_ligaments'], cart: ['articular_disc_of_distal_radio_ulnar_joint']},
    ex: [{name: 'Wrist (radiocarpal) joint', motion: 'wrist', fit: HAND, zoom: 0.6, pivotCentre: true, views: [[-1, 0, 0], [0, -1, 0]]}]},
  hand: {name: 'Hand', bones: HAND,
    soft: {capsule: ['articular_capsules_of_metacarpophalangeal_joints', 'articular_capsules_of_proximal_interphalangeal_joints', 'articular_capsules_of_distal_interphalangeal_joints'],
      lig: ['collateral_metacarpophalangeal_ligaments', 'collateral_interphalangeal_ligaments_of_hand', 'palmar_interphalangeal_ligaments', 'deep_transverse_metacarpal_ligament', 'palmar_carpometacarpal_ligaments', 'dorsal_carpometacarpal_ligaments']},
    ex: [{name: 'Carpometacarpal joint of the thumb', motion: 'thumb', fit: HAND, zoom: 0.95, views: [[0, -1, 0], [-1, -0.2, 0]]},
         {name: 'Metacarpophalangeal joint (index)', motion: 'mcp', fit: ['mc2', 'pp2', 'mp2', 'dp2'], zoom: 0.9, views: [[-1, 0, 0], [0, -1, 0]]},
         {name: 'Interphalangeal joint (index)', motion: 'ip', fit: ['pp2', 'mp2', 'dp2'], zoom: 0.9, views: [[-1, 0, 0]]}]},
};
// facts about each joint, shown under the model: [label, html]
const TEXT = {
  sc: [
    ['Type', 'Synovial, saddle (sellar) joint (StatPearls, Wikipedia; Gray 1918 called it a double plane joint). It moves in three planes.'],
    ['Articular surfaces', 'The sternal (medial) end of the clavicle; the clavicular notch of the manubrium and the first costal cartilage. Sources differ on the tissue covering the surfaces (cartilage, partly fibrocartilage).'],
    ['Articular disc', 'A fibrocartilaginous disc divides the joint into two cavities. It is attached above to the clavicle, below to the first costal cartilage, and around its edge to the capsule.'],
    ['Capsule, ligaments', 'The anterior and posterior sternoclavicular ligaments are thickenings of the capsule. The interclavicular ligament joins the two clavicles across the top of the manubrium. The costoclavicular ligament runs from the first rib and its cartilage to the under surface of the clavicle and limits elevation. The costoclavicular ligament and the posterior capsule are the strongest restraints (sources differ on which is the main one).'],
    ['Movements', 'Elevation and depression (between the clavicle and the disc), protraction and retraction (the disc moves with the clavicle on the sternum), rotation of the clavicle, circumduction. The clavicle moves with every movement of the scapula.'],
    ['Muscles moving the shoulder girdle (Gray 1918)', 'These muscles move the joint through the clavicle and scapula. Elevation: upper trapezius, levator scapulae, clavicular head of sternocleidomastoid. Depression: gravity, subclavius, pectoralis minor, lower trapezius. Retraction: rhomboids, middle and lower trapezius. Protraction: serratus anterior, pectoralis minor.'],
    ['Blood, nerves', 'Internal thoracic and suprascapular arteries. Medial supraclavicular nerve and the nerve to subclavius.'],
    ['Why it matters', 'It is the only joint between the upper limb and the trunk: the clavicle links the shoulder to the sternum.'],
    ['Applied', 'Dislocation is usually anterior. Posterior dislocation is dangerous: the great vessels, trachea, oesophagus and nerves lie behind the joint.']],
  ac: [
    ['Type', 'Synovial plane (gliding) joint.'],
    ['Articular surfaces', 'The lateral (acromial) end of the clavicle and the medial margin of the acromion.'],
    ['Articular disc', 'Variable: often absent or incomplete, rarely complete.'],
    ['Capsule, ligaments', 'The acromioclavicular ligament (thickened capsule above and below) gives front-to-back (horizontal) stability. The coracoclavicular ligament, from the coracoid process to the under surface of the clavicle, lies outside the joint but is its main support against vertical displacement; it has two parts, trapezoid and conoid.'],
    ['Coracoacromial arch', 'The coracoacromial ligament runs from the coracoid process to the acromion (both on the scapula). With them it forms an arch over the head of the humerus and the rotator cuff; the subacromial bursa lies under it.'],
    ['Movements', 'The clavicle glides on the acromion and the scapula rotates on the clavicle, limited by the coracoclavicular ligament. Movement at the acromioclavicular and sternoclavicular joints is needed to raise the arm fully.'],
    ['Nerves', 'Suprascapular nerve. (No open source found for its blood supply.)'],
    ['Applied', '"Separated shoulder": a common injury from a fall on the point of the shoulder, graded I–VI (Rockwood). Grade I: the acromioclavicular ligament is sprained. III: the acromioclavicular and coracoclavicular ligaments are both torn. IV–VI: the clavicle is displaced further and these are usually treated by operation.']],
  shoulder: [
    ['Type', 'Synovial ball-and-socket joint, multiaxial; the most mobile joint of the body.'],
    ['Articular surfaces', 'The large, rounded head of the humerus and the small, shallow glenoid cavity of the scapula: only about a third of the head is in contact with it.'],
    ['Glenoid labrum', 'A fibrocartilaginous rim on the margin of the glenoid cavity that deepens it. The long head of biceps is attached to its upper part.'],
    ['Capsule', 'Very loose. Attached around the glenoid and to the anatomical neck of the humerus. The rotator cuff tendons strengthen it above, in front and behind, but not below: the lower part is the weakest.'],
    ['Synovial membrane', 'Lines the capsule and forms a sheath around the tendon of the long head of biceps, which runs through the joint and down the intertubercular groove: the tendon is inside the capsule but outside the synovial cavity. The membrane communicates with the subscapular bursa.'],
    ['Bursae', 'The subscapular bursa opens into the joint. The large subacromial (subdeltoid) bursa, under the acromion, the coracoacromial ligament and the deltoid and above the supraspinatus, does not open into the joint (unless the supraspinatus tendon is torn right through). The subscapular bursa is not in the 3D model.'],
    ['Ligaments', 'Superior, middle and inferior glenohumeral ligaments: thickenings of the front of the capsule from the glenoid margin to the humerus; the inferior one is the most important. Coracohumeral ligament: from the coracoid process to the greater and lesser tubercles, strengthening the top of the capsule. Transverse humeral ligament: bridges the intertubercular groove over the biceps tendon (recent studies find it is mostly fibres of the supraspinatus and subscapularis tendons).'],
    ['Rotator cuff', 'Subscapularis in front; supraspinatus above; infraspinatus and teres minor behind. Their short, flat tendons fuse with the capsule and hold the head in the glenoid cavity.'],
    ['Relations', 'Above: supraspinatus, the coracoacromial arch and the subacromial bursa. In front: subscapularis. Behind: infraspinatus and teres minor. Below: the axillary nerve and the posterior circumflex humeral vessels. Inside: the tendon of the long head of biceps.'],
    ['Movements, muscles', '<table class="t"><tr><th>Movement</th><th>Muscles</th></tr>' +
      '<tr><td>Flexion</td><td>Pectoralis major (clavicular part), anterior deltoid, coracobrachialis</td></tr>' +
      '<tr><td>Extension</td><td>Latissimus dorsi, posterior deltoid (and teres major, Gray 1918)</td></tr>' +
      '<tr><td>Abduction</td><td>Supraspinatus starts it (the first 15–30°; sources differ), the deltoid continues; the scapula rotates upwards (trapezius, serratus anterior), above 90° mostly the scapula</td></tr>' +
      '<tr><td>Adduction</td><td>Pectoralis major, latissimus dorsi, teres major, subscapularis</td></tr>' +
      '<tr><td>Medial rotation</td><td>Subscapularis, pectoralis major, latissimus dorsi, teres major, anterior deltoid</td></tr>' +
      '<tr><td>Lateral rotation</td><td>Infraspinatus, teres minor</td></tr></table>'],
    ['Raising the arm', 'The arm is raised by the glenohumeral joint and by upward rotation of the scapula: after the first ~30°, about 2° at the shoulder joint for every 1° of scapular rotation; above 90° mostly scapular rotation (sources differ on the timing). Full elevation also needs the acromioclavicular and sternoclavicular joints. (In the 3D model only the glenohumeral joint moves.)'],
    ['Stability', 'The shallow socket gives mobility at the cost of stability. Static stabilisers: the labrum, capsule, glenohumeral ligaments and the concave glenoid. Dynamic: the rotator cuff, the long head of biceps and the muscles around the scapula.'],
    ['Blood, nerves', 'Arteries: anterior and posterior circumflex humeral, suprascapular. Nerves: axillary, suprascapular and lateral pectoral. The axillary and suprascapular nerves also supply muscles that move the joint, which fits Hilton\'s law.'],
    ['Applied', '<b>Dislocation:</b> the most commonly dislocated major joint (about half of all dislocations), almost always anterior, usually below the coracoid, from force on the abducted, laterally rotated arm. It can injure the <b>axillary nerve</b>: weak deltoid and abduction, numb skin over the lower deltoid. It can tear the anterior labrum (Bankart lesion) and dent the head of the humerus (Hill–Sachs lesion).<br><b>Rotator cuff:</b> the supraspinatus tendon is the most often torn; it runs under the acromion. <b>Impingement:</b> the cuff tendons and bursa are pinched under the coracoacromial arch, with a painful arc between about 60° and 120° of abduction.<br><b>Frozen shoulder</b> (adhesive capsulitis): inflammation and fibrosis of the capsule; painful, increasing loss of active and passive movement, lateral rotation most; middle age, diabetes, thyroid disease; freezing, frozen and thawing stages over about 2–3 years.']],
  elbow: [
    ['Type', 'Synovial hinge joint. The humero-ulnar, humero-radial and proximal radio-ulnar joints share one capsule and one synovial cavity. The humero-ulnar part is a simple hinge; the humero-radial part takes part in both flexion–extension and pronation–supination (sources give it different type names).'],
    ['Articular surfaces', 'The trochlea of the humerus with the trochlear notch of the ulna; the capitulum of the humerus with the shallow upper surface of the head of the radius.'],
    ['Capsule, synovial membrane', 'The capsule is strengthened at the sides by the collateral ligaments and is weak in front and behind. The synovial membrane is extensive: it lines the coronoid, radial and olecranon fossae and runs down to the proximal radio-ulnar joint; fat pads lie between it and the capsule over the fossae.'],
    ['Ligaments', '<b>Ulnar (medial) collateral:</b> triangular, from the medial epicondyle, with an anterior band (to the coronoid process), a posterior band (to the olecranon) and a transverse band; the anterior band is the main restraint against valgus stress. <b>Radial (lateral) collateral:</b> from the lateral epicondyle to the annular ligament; part of a lateral ligament complex that resists varus stress.'],
    ['Relations', 'In front: brachialis, and in the cubital fossa the biceps tendon, brachial artery and median nerve. Behind: triceps and anconeus. Medially: the common flexor origin; the ulnar nerve behind the medial epicondyle. Laterally: supinator and the common extensor origin; the radial nerve in front of the lateral epicondyle.'],
    ['Movements, muscles', 'Flexion: brachialis, biceps brachii, brachioradialis. Extension: triceps, with anconeus. Range about 0° to 140–150°. There is no side-to-side movement at the humero-ulnar joint.'],
    ['Carrying angle', 'With the elbow extended and the forearm supinated, the forearm angles outward from the arm, because the trochlea is oblique; the angle disappears in flexion. It is on average larger in women in several studies, though not in all: about 10° in men and 13° in women (values differ between sources).'],
    ['Blood supply (anastomosis)', 'An anastomosis around the elbow joins descending branches of the brachial artery (superior and inferior ulnar collateral) and of the profunda brachii (radial collateral; Gray 1918 adds the middle collateral) with ascending branches of the ulnar (anterior and posterior ulnar recurrent), radial (radial recurrent) and interosseous (recurrent interosseous) arteries.'],
    ['Nerves', 'Musculocutaneous, median, ulnar and radial nerves (the radial is not in older texts).'],
    ['Applied', '<b>Dislocation:</b> common, usually posterior, after a fall on the outstretched hand. <b>Supracondylar fracture:</b> the commonest elbow fracture in children; usually extension-type from a fall on the outstretched hand; it can injure the brachial artery and median nerve and cause compartment syndrome. <b>Cubitus valgus</b> (forearm angled out more than normal), e.g. after non-union of a lateral condyle fracture, can stretch the ulnar nerve and cause a late (tardy) ulnar palsy; <b>cubitus varus</b> (angled in) commonly follows supracondylar fracture. <b>Cubital tunnel:</b> the elbow is the commonest site of ulnar nerve compression. <b>Tennis elbow:</b> overuse tendinopathy of the common extensor origin at the lateral epicondyle (especially extensor carpi radialis brevis); <b>golfer\'s elbow:</b> the same at the common flexor origin, medial epicondyle; less common.']],
  radioulnar: [
    ['Joints', '<b>Proximal:</b> a pivot joint; the head of the radius turns in a ring formed by the radial notch of the ulna and the annular ligament. <b>Middle:</b> the interosseous membrane (a fibrous union). <b>Distal:</b> a pivot joint between the head of the ulna and the ulnar notch of the radius.'],
    ['Annular ligament', 'A strong band round the head of the radius, attached to the front and back of the radial notch; it holds the head against the ulna. Below it, the quadrate ligament runs from the radial notch to the neck of the radius (its existence is disputed).'],
    ['Interosseous membrane', 'Joins the shafts of the radius and ulna. Its main fibres run downward and medially from radius to ulna, so force from the hand reaching the radius is passed to the ulna. It separates the front and back compartments of the forearm and gives attachment to deep muscles. The oblique cord, a small band above it, is sometimes absent.'],
    ['Articular disc (TFCC)', 'A triangular fibrocartilage below the head of the ulna: apex at the base of the ulnar styloid, base on the edge of the radius. It separates the distal radio-ulnar joint (above) from the wrist joint (below) and keeps the ulna out of the wrist joint. With the palmar and dorsal radio-ulnar ligaments and nearby structures it forms the triangular fibrocartilage complex, the main stabiliser of the distal radio-ulnar joint.'],
    ['Movements, muscles', 'Pronation and supination: the radius turns round the ulna, about 80° each way. Supination: biceps brachii (strongest with the elbow flexed) and supinator. Pronation: pronator teres and pronator quadratus.'],
    ['Applied', '<b>Pulled elbow</b> (nursemaid\'s elbow): in a child of about 1–4 years, a sudden pull on the extended, pronated arm makes the head of the radius slip partly out of the annular ligament. The child holds the arm still and will not supinate it; it is usually easily reduced. <b>TFCC tears</b> (from injury or wear) cause pain on the ulnar side of the wrist.']],
  wrist: [
    ['Type', 'Synovial ellipsoid (condyloid) joint: biaxial, no rotation (rotation of the hand comes from pronation and supination).'],
    ['Articular surfaces', 'Above (concave): the lower end of the radius and the articular disc. Below (convex): the scaphoid, lunate and triquetrum. The ulna does not take part (the disc lies between).'],
    ['Capsule, synovial membrane', 'A loose capsule with a lax synovial membrane. In the classical description its cavity is separate from the distal radio-ulnar joint (by the disc) and from the midcarpal joint (by the ligaments between the proximal carpal bones); one Wikipedia article describes a common cavity.'],
    ['Ligaments', 'Palmar and dorsal radiocarpal ligaments (radius to the proximal row of carpal bones, Gray 1918), radial and ulnar collateral ligaments. Modern descriptions split the palmar radiocarpal ligament into bands (radioscaphocapitate, long radiolunate and others). The model also shows ligaments between the carpal bones.'],
    ['Movements, muscles', 'Flexion, extension, abduction (radial deviation), adduction (ulnar deviation) and circumduction; adduction is greater than abduction. They take place at both the radiocarpal and midcarpal joints. Flexion: flexor carpi radialis, flexor carpi ulnaris (and palmaris longus, Gray 1918). Extension: extensor carpi radialis longus and brevis, extensor carpi ulnaris. Adduction: flexor and extensor carpi ulnaris. Abduction: flexor carpi radialis, extensor carpi radialis longus (and brevis, Gray 1918).'],
    ['Relations', 'In front, the flexor tendons; behind, the extensor tendons.'],
    ['Blood, nerves', 'Palmar and dorsal carpal branches of the radial and ulnar arteries. Posterior interosseous nerve and branches of the ulnar nerve.'],
    ['Joints of the carpus', 'Between the bones of each row: plane (gliding) joints with dorsal, palmar and interosseous ligaments. <b>Midcarpal joint:</b> an S-shaped joint between the two rows; in the middle the head of the capitate fits into a cup formed by the scaphoid and lunate.'],
    ['Applied', 'Lunate and perilunate dislocations: high-energy injuries that progress from a tear of the scapholunate ligament to perilunate dislocation and finally lunate dislocation.']],
  hand: [
    ['Thumb carpometacarpal', 'Saddle joint between the trapezium and the base of the first metacarpal, with a loose capsule and its own synovial cavity. Flexion and extension in the plane of the palm, abduction and adduction at right angles to it, circumduction and opposition (bringing the pulp of the thumb onto the flexed fingers, which needs rotation of the metacarpal). Its ligaments are described differently in different sources.'],
    ['Opposition', 'Opponens pollicis is the main muscle (StatPearls); Gray 1918 credited the flexors and the adductor.'],
    ['Other carpometacarpal', 'The 2nd–5th are plane (gliding) joints in Gray 1918 (some modern sources call them condyloid), with dorsal and palmar ligaments; the 2nd and 3rd hardly move, the 4th and especially the 5th move more.'],
    ['Metacarpophalangeal', 'The rounded head of the metacarpal fits a shallow cavity on the base of the proximal phalanx: flexion, extension, abduction, adduction and limited circumduction. Each has two collateral ligaments and a <b>palmar plate</b> (a thick fibrocartilaginous plate in front that deepens the socket and limits hyperextension). The deep transverse metacarpal ligament joins the palmar plates of the four fingers.'],
    ['Interphalangeal', 'Hinge joints: flexion and extension only; extension is limited by the palmar and collateral ligaments.'],
    ['Muscles', 'Dorsal interossei abduct and palmar interossei adduct the fingers, from and to the line of the middle finger. Lumbricals and interossei flex the metacarpophalangeal joints and extend the interphalangeal joints.'],
    ['Applied', '<b>Skier\'s / gamekeeper\'s thumb:</b> tear of the ulnar collateral ligament of the thumb MCP joint by forced abduction (± hyperextension); if the torn end lies over the adductor pollicis aponeurosis (Stener lesion) it cannot heal and needs surgery. <b>Osteoarthritis</b> of the base of the thumb is common (in one study of people in their 50s–60s, 33% of women and 11% of men; another source says the sexes are equally affected). <b>Arthritis pattern:</b> rheumatoid arthritis typically affects the MCP joints and spares the DIP joints; osteoarthritis typically affects the DIP joints.']]};
// a tapped part: its description (attachments, function); parts without one show only their name
const PART = {
  articular_disc_of_sternoclavicular_joint: 'Fibrocartilage; divides the joint into two cavities. Attached to the clavicle above and the first costal cartilage below.',
  anterior_sternoclavicular_ligament: 'Thickening of the front of the capsule, clavicle to manubrium.',
  posterior_sternoclavicular_ligament: 'Thickening of the back of the capsule; with the costoclavicular ligament, the strongest restraint of the joint (sources differ on which is the main one).',
  interclavicular_ligament: 'Joins the two clavicles across the top of the manubrium.',
  costoclavicular_ligament: 'First rib and its cartilage to the under surface of the clavicle; limits elevation of the clavicle.',
  articular_disc_of_acromioclavicular_joint: 'Often absent or incomplete; rarely complete.',
  acromioclavicular_ligament: 'Thickened capsule above (and below) the joint; front-to-back stability.',
  conoid_ligament: 'Part of the coracoclavicular ligament (coracoid process to clavicle): the main support of the acromioclavicular joint against vertical displacement.',
  trapezoid_ligament: 'Part of the coracoclavicular ligament (coracoid process to clavicle): the main support of the acromioclavicular joint against vertical displacement.',
  coraco_acromial_ligament: 'Coracoid process to acromion. With them it forms the coracoacromial arch over the head of the humerus and the rotator cuff.',
  articular_capsule_of_glenohumeral_joint: 'Very loose; glenoid margin to the anatomical neck. Strengthened by the rotator cuff above, in front and behind, not below: the lower part is the weakest.',
  glenoid_labrum: 'Fibrocartilaginous rim that deepens the shallow glenoid cavity; the long head of biceps is attached to its upper part.',
  superior_glenohumeral_ligament: 'One of three thickenings of the front of the capsule, glenoid margin to humerus.',
  middle_glenohumeral_ligament: 'One of three thickenings of the front of the capsule, glenoid margin to humerus.',
  inferior_glenohumeral_ligament: 'The most important of the three glenohumeral ligaments (thickenings of the front of the capsule).',
  coracohumeral_ligament: 'Coracoid process to the greater and lesser tubercles; strengthens the top of the capsule.',
  transverse_humeral_ligament: 'Bridges the intertubercular groove over the tendon of the long head of biceps (recent studies: mostly fibres of the supraspinatus and subscapularis tendons).',
  subacromial_bursa: 'Under the acromion and the coracoacromial ligament, above the supraspinatus; it does not open into the joint (unless the supraspinatus tendon is torn right through).',
  subdeltoid_bursa: 'Between the deltoid and the capsule; in most people it communicates with the subacromial bursa (the "subacromial–subdeltoid bursa").',
  articular_capsule_of_elbow_joint: 'Strong at the sides (collateral ligaments), weak in front and behind. One capsule for the humero-ulnar, humero-radial and proximal radio-ulnar joints.',
  ulnar_collateral_ligament: 'Triangular, from the medial epicondyle: anterior band to the coronoid process (the main restraint against valgus stress), posterior band to the olecranon, and a transverse band.',
  radial_collateral_ligament: 'From the lateral epicondyle to the annular ligament.',
  annular_ligament_of_radius: 'A strong band round the head of the radius, attached to the front and back of the radial notch of the ulna; it holds the head against the ulna. In a pulled elbow the head slips partly out of it.',
  quadrate_ligament: 'A band from the radial notch of the ulna to the neck of the radius, below the annular ligament (its existence is disputed).',
  interosseous_membrane_of_forearm: 'Joins the shafts of radius and ulna; its fibres run downward and medially from the radius, passing force from the radius to the ulna. Separates the front and back compartments.',
  oblique_cord: 'Small band above the interosseous membrane; sometimes absent.',
  articular_disc_of_distal_radio_ulnar_joint: 'Triangular fibrocartilage: apex at the base of the ulnar styloid, base on the radius. Separates the distal radio-ulnar joint from the wrist joint.',
  palmar_radio_ulnar_ligament: 'With the dorsal radio-ulnar ligament and the disc, part of the triangular fibrocartilage complex that stabilises the distal radio-ulnar joint.',
  dorsal_radio_ulnar_ligament: 'With the palmar radio-ulnar ligament and the disc, part of the triangular fibrocartilage complex that stabilises the distal radio-ulnar joint.',
  articular_capsule_of_radiocarpal_joint: 'Loose capsule of the wrist joint with a lax synovial membrane.',
  collateral_metacarpophalangeal_ligaments: 'Two strong cords on the sides of each metacarpophalangeal joint.',
  palmar_interphalangeal_ligaments: 'Palmar plates: thick fibrocartilaginous plates on the front of the joints; they deepen the socket and limit hyperextension.',
  deep_transverse_metacarpal_ligament: 'Joins the palmar plates of the four fingers (not the thumb).',
};
const DATA = {
  lede: 'The joints of the shoulder girdle, shoulder, elbow, forearm, wrist and hand, on the bones of the right upper limb, with their capsules, ligaments, discs and bursae. Pick a joint; turn the model, peel the capsule, tap a ligament, and make the joint move. General ideas (joint types, synovial joints, Hilton\'s law) are on the <a href="../general/joints.html">Joints</a> page.',
  based: 'Based on: Gray\'s <i>Anatomy</i> (20th ed., 1918); StatPearls (NCBI Bookshelf); Wikipedia; open-access papers (e.g. DePalma 1963 on the shoulder). Where they differ, the page says so.',
  models: 'Models used: bones from BodyParts3D, © The Database Center for Life Science (CC BY-SA 2.1 Japan); capsules, ligaments, discs, labrum and bursae from Z-Anatomy (CC BY-SA 4.0), smoothed and thickened as Z-Anatomy shows them. Articular cartilage is not in the model. The axes of movement are fitted to the model and approximate; the movements are illustrations, not normal ranges.',
  mnote: 'The bone that moves is darker; the line is the axis. Axes are fitted to the model and approximate; the arcs show the kind of movement, not its range. The capsule and ligaments are hidden while a joint moves (the model cannot stretch them).'};

/* ===================== 3D ===================== */
const $ = id => document.getElementById(id);
const v = new AtlasViewer($('v')); window.atlas = v; v.ghostAlpha = 0.14;
let motions = {}, cur = null, ex = null, anim = 0, names = {}, selPart = null, moved = false;
const on = {capsule: true, lig: true, cart: true, bursa: false};
const COL = {capsule: '--capsule', lig: '--lig', cart: '--cart', bursa: '--bursa'};
const layerOf = k => { for (const l in JOINTS[cur].soft) if (JOINTS[cur].soft[l].includes(k)) return l; return null; };
function softKeys() { return Object.values(JOINTS[cur].soft).flat(); }
function applyVisibility() {
  const J = JOINTS[cur], show = new Set(J.bones.concat(ex && ex.showHand ? HAND : []));
  for (const k of v.order) {
    const l = layerOf(k);
    v.setVisible(k, l ? on[l] && !moved : show.has(k));
  }
}
function resetPose() { for (const k of v.order) v.setTransform(k, null); v.setLines(null); moved = false; }
function selectPart(k) {
  selPart = k;
  document.querySelectorAll('#plist button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  v.setFocus(k ? [k] : null);
  $('pcap').innerHTML = k ? `<b>${names[k]}.</b> ${PART[k] || ''}` : 'Tap a part of the joint, on the model or in the list.';
}
function showJoint(j, i = 0) {
  cancelAnimationFrame(anim); anim = 0;
  cur = j; ex = JOINTS[j].ex[i]; resetPose();
  const J = JOINTS[j], m = ex.motion ? motions[ex.motion] : null, moving = new Set(m ? m.moving : []);
  for (const k of v.order) { const l = layerOf(k); v.setColour(k, l ? COL[l] : moving.has(k) ? '--move' : '--bone'); }
  applyVisibility(); selectPart(null);
  v.fit(ex.fit || J.bones); if (ex.pivotCentre && m) v.centre = m.pivot.slice();
  const w0 = (ex.views || [[0, -1, 0]])[0]; v.face(w0.slice(0, 3), {zoom: w0[3] || ex.zoom || 1});
  document.querySelectorAll('#joints button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === j));
  // layers present in this joint
  const lb = $('layers'); lb.replaceChildren();
  for (const [l, name, tok] of LAYERS) if (J.soft[l]) {
    const b = document.createElement('button'); b.className = 'chip'; b.setAttribute('aria-pressed', on[l]);
    b.innerHTML = `<i style="background:var(${tok})"></i>${name}`;
    b.onclick = () => { on[l] = !on[l]; b.setAttribute('aria-pressed', on[l]); applyVisibility(); }; lb.append(b);
  }
  const pl = $('plist'); pl.replaceChildren();
  for (const k of softKeys()) { const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<i style="background:var(${COL[layerOf(k)]})"></i>${names[k]}`;
    b.onclick = () => { const l = layerOf(k); if (!on[l]) { on[l] = true; showJoint.refreshLayers(); applyVisibility(); } selectPart(selPart === k ? null : k); };
    pl.append(b); }
  const exb = $('ex-chips'); exb.replaceChildren();
  if (J.ex.length > 1) J.ex.forEach((e, n) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = e.name;
    b.setAttribute('aria-pressed', n === i); b.onclick = () => showJoint(j, n); exb.append(b); });
  buildMoves(m);
  $('mnote').innerHTML = m ? `<span class="axiskey"></span>${DATA.mnote}` : '';
  $('h-joint').textContent = J.title || J.name + ' joint' + (j === 'hand' || j === 'radioulnar' ? 's' : '');
  $('jtext').innerHTML = (TEXT[j] || []).map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
}
showJoint.refreshLayers = () => document.querySelectorAll('#layers button').forEach((b, n) => {
  const l = LAYERS.filter(x => JOINTS[cur].soft[x[0]])[n][0]; b.setAttribute('aria-pressed', on[l]); });
function pose(m, mi, f) {
  const mv = m.moves[mi];
  const xf = mv.axis ? AtlasViewer.rotation(mv.axis, f, m.pivot) : {m: [[1, 0, 0], [0, 1, 0], [0, 0, 1]], t: mv.slide.map(x => x * f)};
  for (const k of m.moving) v.setTransform(k, xf.m, xf.t);
  const was = moved; moved = Math.abs(f) > 0.01; if (was !== moved) applyVisibility();
  const L = 60;
  v.setLines(mv.axis ? [{a: m.pivot.map((c, i) => c - mv.axis[i] * L), b: m.pivot.map((c, i) => c + mv.axis[i] * L), color: '--axis'}] : null);
}
function buildMoves(m) {
  const box = $('moves'); box.replaceChildren();
  if (!m) return;
  let last = 0;
  const stop = () => { cancelAnimationFrame(anim); anim = 0; box.querySelectorAll('.play').forEach(p => p.setAttribute('aria-pressed', 'false')); };
  const others = i => {
    box.querySelectorAll('.move').forEach((r, j) => { if (j !== i) r.querySelector('input').value = 0; });
    const w = ex.views && ex.views[i]; if (i !== last && w) v.face(w.slice(0, 3), {zoom: w[3] || ex.zoom || 1});
    last = i;
  };
  m.moves.forEach((mv, i) => {
    const [a, b] = mv.arc;
    const row = document.createElement('div'); row.className = 'move';
    row.innerHTML = `<span class="name">${mv.name}</span><button class="play" aria-pressed="false">▶ Move</button>
      <input type="range" min="${a}" max="${b}" step="0.5" value="0" aria-label="${mv.name}">`;
    const rng = row.querySelector('input'), play = row.querySelector('.play');
    rng.oninput = () => { stop(); others(i); pose(m, i, +rng.value); };
    play.onclick = () => {
      const go = play.getAttribute('aria-pressed') !== 'true'; stop(); if (!go) { rng.value = 0; pose(m, i, 0); return; }
      others(i); play.setAttribute('aria-pressed', 'true');
      const t0 = performance.now(), T = 3600;
      const step = now => { const k = ((now - t0) % T) / T, s = Math.sin(k * 2 * Math.PI), f = s < 0 ? -s * a : s * b;
        rng.value = f; pose(m, i, f); anim = requestAnimationFrame(step); };
      anim = requestAnimationFrame(step);
    };
    box.append(row);
  });
}
v.onPick = hit => { if (!hit) { selectPart(null); return; } if (layerOf(hit.key)) selectPart(hit.key); };
(async () => {
  $('lede').innerHTML = DATA.lede; $('based').innerHTML = DATA.based; $('models').innerHTML = DATA.models;
  const [mo, man] = await Promise.all([fetch('../models/ul-joints/motions.json').then(r => r.json()), v.load('../models/ul-joints/ul-joints.json')]);
  motions = mo.motions;
  for (const p of man.parts) names[p.key] = p.name;
  for (const [k, J] of Object.entries(JOINTS)) {
    const b = document.createElement('button'); b.className = 'chip'; b.dataset.k = k; b.textContent = J.name;
    b.onclick = () => showJoint(k); $('joints').append(b);
  }
  showJoint('shoulder');
  window.J = {JOINTS, showJoint};   // for tests
  window.ready = true;
})().catch(e => { $('pcap').textContent = 'Could not load the 3D model: ' + e.message; window.loadError = String(e); });
</script>
