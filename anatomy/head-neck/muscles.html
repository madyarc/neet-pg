/* ===================== PAGE (shared logic: ../assets/muscle-page.js) ===================== */
function buildMore(api) {
  const {v, focusOn, pressed, clearRows} = api, $ = id => document.getElementById(id);
  const names = () => api.names();
  const rowTable = (id, rows, dir, pre) => {
    const t = $(id);
    t.innerHTML = rows.map(([n, , txt], i) => `<tr data-k="${id}${i}" aria-pressed="false"><td>${n}</td><td>${txt}</td></tr>`).join('');
    t.querySelectorAll('tr').forEach((r, i) => r.onclick = () => {
      const [n, ks, txt] = rows[i], has = ks.filter(api.has);
      clearRows(); pressed('#fascia-list button', () => false); r.setAttribute('aria-pressed', 'true');
      $('more-desc').innerHTML = `<b>${pre}${n}:</b> ${txt}`;
      focusOn(has); v.fit(has); v.face(dir, {zoom: 1});
    });
  };
  rowTable('tri', MORE.tri, [-0.6, -1, 0.05], 'Triangles of the neck, ');
  rowTable('jaw', MORE.jaw, [-1, -0.3, 0], '');
  rowTable('eye', MORE.eye, [-0.3, -1, 0.3], 'H test, ');
  const box = $('fascia-list'); box.replaceChildren();
  for (const [k, name, text] of MORE.fascia) {
    if (!api.has(k)) continue;
    const b = document.createElement('button'); b.dataset.k = k; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<i style="background:var(--fascia)"></i><span>${name}</span>`;
    b.onclick = () => { clearRows(); pressed('#fascia-list button', x => x === k); $('more-desc').innerHTML = `<b>${name}.</b> ${text}`;
      focusOn([k]); v.fit([k]); v.face([-0.7, -1, 0.15], {zoom: 1}); };
    box.append(b);
  }
  $('fascia-text').innerHTML = MORE.fasciaText.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  $('absent').innerHTML = MORE.absent.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  $('clin').innerHTML = MORE.clin.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
}
