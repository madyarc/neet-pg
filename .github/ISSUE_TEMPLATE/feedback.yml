name: Report a problem or suggestion
description: A wrong fact, a typo, a drawing or label in the wrong place, a page that doesn't work, or an idea.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Every report is checked against our sources, and fixes go live for everyone.
        **Reports are public: please don't include your name, phone number or other personal details.**
  - type: input
    id: page
    attributes:
      label: Page
      description: Filled in for you when you use the link at the bottom of a page.
      placeholder: https://madyarc.github.io/neet-pg/...
    validations:
      required: false
  - type: dropdown
    id: type
    attributes:
      label: What kind of problem?
      options:
        - Wrong or doubtful fact
        - Typo or unclear wording
        - Drawing, 3D model or label wrong
        - Page broken or slow
        - Suggestion or missing topic
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Which part of the page, and what it says now.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should it be? (optional)
      description: The correction, and a source if you have one (textbook and edition, guideline, paper).
  - type: input
    id: device
    attributes:
      label: Device (optional)
      placeholder: e.g. Android phone, Chrome, dark theme
