<style>

<body>
<div class="wrap">

<header class="stack">

<section class="split">
  <div class="panel stack">

      <label><input type="checkbox" id="fix"> Correcting lens</label>

<section class="panel stack">
  <h2 id="h-cond"></h2>
  <div class="stack" id="about"></div>
</section>

  <h2>Accommodation and age</h2>
  <div class="stack" id="accom"></div>

  <div class="stack" id="ambly"></div>

<script>
"use strict";
/* ================= DATA (every statement checked: see ophthalmology/DATA-SOURCES.md) ================= */
const EYE = { P: 60, n: 1.336, pupil: 4, pinhole: 1 };  // schematic reduced eye: total power (D), index inside, pupil (mm)
const AMP = [[15, 13], [25, 10], [40, 6], [50, 2], [60, 1]];   // approximate amplitude of accommodation (D) by age
const D = dl => dl ? 1000 * EYE.n / (L0 + dl) - EYE.P : 0;      // error (D) made by a length change dl (mm) in this model
const CONDS = [
  { key: 'emm', short: 'Normal (emmetropia)', name: 'Emmetropia',
    state: () => ({ AL: L0, Pv: EYE.P, Ph: EYE.P }),
    say: (E, c) => c.near && c.cyclo ? 'With accommodation blocked by the drops, a near object focuses behind the retina and blurs.' : c.near ? `Near object: the eye adds ${E.A.toFixed(1)} D of its own (accommodation) to keep the focus on the retina.` : 'Parallel rays from a distant object focus on the retina with accommodation relaxed.',
    about: [
      { k: 1, t: '<b>Emmetropia:</b> parallel rays from a distant object come to a focus on the retina while accommodation is relaxed. The far point is at infinity.' },
      { t: '<b>Where the power comes from.</b> The relaxed adult eye has about +60 D. The cornea gives about +43 D, about two-thirds of it, mostly at its front surface, where light passes from air into the tear film and the index changes most (the back surface adds about −6 D). The lens gives the rest, about one-third (about +18 to +20 D unaccommodated).' },
      { t: '<b>Numbers:</b> adult eye length about 23–24 mm; refractive index of the cornea about 1.376, of the aqueous and vitreous about 1.336. A dioptre is 1 ÷ focal length in metres: a +3 D lens focuses parallel light at 1/3 m.' }
    ] },
  { key: 'myo', short: 'Myopia', name: 'Myopia (short sight)',
    sliders: [{ id: 'dl', label: 'Eye longer by', min: 0, max: 4, step: 0.1, val: 1.5, fmt: v => v.toFixed(1) + ' mm' }],
    state: v => ({ AL: L0 + v.dl, Pv: EYE.P, Ph: EYE.P }),
    say: (E) => { const e = E.errV; return e > -0.05 ? 'No error.' : `About ${fmt(e)} of myopia in this model. Far point: ${(100 / -e).toFixed(0)} cm in front of the eye; beyond that, things blur. A concave (minus) lens fixes it.`; },
    about: [
      { k: 1, t: '<b>Myopia:</b> parallel rays focus <b>in front of</b> the retina with accommodation relaxed. It is defined as −0.50 D or more; high myopia as −6.00 D or more.' },
      { t: '<b>Axial myopia</b> (the eye is too long) is the commoner kind. <b>Refractive myopia</b>: the cornea or lens is too strong, from surfaces too steep (curvature myopia) or a higher index (index myopia, for example a cataract).' },
      { t: '<b>Far point:</b> a finite distance in front of the eye, 1 ÷ the myopia in metres: −2 D sees clearly out to 50 cm. Accommodation can only add power, so a myope cannot focus beyond the far point.' },
      { t: '<b>Correction:</b> a concave (minus, diverging) lens. <b>Rule of thumb:</b> each extra millimetre of eye length adds roughly 2–3 D of myopia (the textbook figure is about 3 D; measured values in progressing myopia are nearer 2 D).' },
      { w: 1, t: '<b>Pathological myopia:</b> excessive lengthening that damages the back of the eye: posterior staphyloma, myopic maculopathy (lacquer cracks, Fuchs spots) and optic disc changes, with a higher risk of retinal detachment and glaucoma. It is defined by these changes; sources give different number cut-offs.' }
    ] },
  { key: 'hyp', short: 'Hypermetropia', name: 'Hypermetropia (long sight)',
    sliders: [{ id: 'dl', label: 'Eye shorter by', min: 0, max: 3, step: 0.1, val: 1.2, fmt: v => v.toFixed(1) + ' mm' }],
    state: v => ({ AL: L0 - v.dl, Pv: EYE.P, Ph: EYE.P }),
    say: (E, c) => { const e = E.errV; if (e < 0.05) return 'No error.';
      if (c.fix && c.near && c.cyclo) return 'The plus lens corrects the error, but with accommodation blocked the near object still blurs.';
      if (c.fix) return c.near ? `The plus lens corrects the error; the eye accommodates ${E.A.toFixed(1)} D only for the near object.` : 'The plus lens corrects the error: no accommodation is needed for distance.';
      if (c.near && !c.cyclo) return Math.abs(E.fV - E.s.AL) < 0.05 ? `It accommodates ${E.A.toFixed(1)} D: about ${e.toFixed(1)} D for the error plus ${(1 / NEAR).toFixed(1)} D for the near object.` : `Error (about ${fmt(e)}) plus the near object needs more accommodation than the eye has: the image blurs.`;
      return c.cyclo ? `With accommodation blocked, the full error shows: about ${fmt(e)}. A convex (plus) lens fixes it.`
        : E.A > 0.01 && Math.abs(E.fV - E.s.AL) < 0.05 ? `A young eye hides the error by accommodating (${E.A.toFixed(1)} D). Tick “Cycloplegic drops” to see the error it is hiding.`
        : `Accommodation cannot make up the whole error (about ${fmt(e)}): the image stays blurred.`; },
    about: [
      { k: 1, t: '<b>Hypermetropia:</b> parallel rays focus <b>behind</b> the retina with accommodation relaxed. <b>Axial</b> hypermetropia, a short eye, is the commonest type.' },
      { t: '<b>Correction:</b> a convex (plus, converging) lens.' },
      { t: '<b>Parts of the error.</b> Total = latent + manifest. <b>Latent</b> is hidden by the tone of the ciliary muscle and shows only after cycloplegic drops. <b>Manifest</b> is found without drops; the part accommodation can overcome is <b>facultative</b>, the rest is <b>absolute</b>.' },
      { w: 1, t: '<b>Angle-closure glaucoma:</b> hypermetropic eyes are short, with a shallow anterior chamber and a narrow angle, and are more prone to angle closure.' }
    ] },
  { key: 'astig', short: 'Astigmatism', name: 'Astigmatism',
    sliders: [
      { id: 'v', label: 'Vertical meridian error', min: -3, max: 3, step: 0.25, val: -1.5, fmt: v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + ' D' },
      { id: 'h', label: 'Horizontal meridian error', min: -3, max: 3, step: 0.25, val: 0, fmt: v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + ' D' }],
    state: v => ({ AL: L0, Pv: EYE.P - v.v, Ph: EYE.P - v.h }),   // error −x D = the meridian is x D too strong
    say: (E, c) => astigType(E, c),
    about: [
      { k: 1, t: '<b>Astigmatism:</b> the eye\'s power differs between meridians, so a point is focused as two lines at right angles instead of a point. Give the two meridians different errors with the sliders above (a minus error: that meridian focuses in front of the retina).' },
      { t: '<b>Conoid of Sturm:</b> the bundle of rays between and around the two focal lines; the gap between the lines is the interval of Sturm. Midway between them (in dioptres) lies a round blur, the <b>circle of least confusion</b>; the spherical equivalent puts it on the retina.' },
      { t: '<b>Types</b> (accommodation relaxed): simple myopic (one line on the retina, one in front); simple hypermetropic (one on, one behind); compound myopic (both in front); compound hypermetropic (both behind); mixed (one in front, one behind).' },
      { t: '<b>With the rule:</b> the vertical meridian is the steepest (corrected with a minus cylinder at axis 180°); usual in the young. <b>Against the rule:</b> the horizontal meridian is the steepest (minus cylinder at axis 90°); it becomes commoner with age. <b>Oblique:</b> the principal meridians lie at about 30–60° or 120–150°.' },
      { t: '<b>Regular</b> astigmatism (principal meridians at right angles) is corrected with a cylindrical (toric) lens. <b>Irregular</b> astigmatism (keratoconus, corneal scars) cannot be; rigid gas-permeable contact lenses are used, as they give the eye a new, regular front surface.' }
    ] },
  { key: 'presby', short: 'Presbyopia', name: 'Presbyopia', near: true,
    sliders: [{ id: 'age', label: 'Age', min: 15, max: 70, step: 1, val: 55, fmt: v => v + ' years' }],
    state: v => ({ AL: L0, Pv: EYE.P, Ph: EYE.P, age: v.age }),
    say: (E, c) => { if (!c.near) return 'Distance vision does not need accommodation, so presbyopia leaves it clear. Tick “Near object”.';
      const need = 1 / NEAR, short = need - E.amp;
      if (c.cyclo) return 'Cycloplegic drops block accommodation altogether, so the near object blurs; the reading addition for this age is not enough.';
      return c.fix ? `A reading addition of ${fmt(E.lensV)} makes up what accommodation can no longer supply.` :
        short <= 0 ? `Reading at ${NEAR * 100} cm needs ${need.toFixed(1)} D of accommodation; this eye still has about ${E.amp.toFixed(1)} D.` :
        `Reading at ${NEAR * 100} cm needs ${need.toFixed(1)} D, but at this age only about ${E.amp.toFixed(1)} D is left: the print blurs. A convex (plus) reading addition fixes it.`; },
    about: [
      { k: 1, t: '<b>Presbyopia:</b> the age-related loss of accommodation, which makes near work difficult. Symptoms usually begin in the early to mid 40s; hypermetropes notice it earlier. Corrected with a convex (plus) reading addition.' },
      { t: 'In this model the eye may use all of its accommodation (schematic); the age at which reading blurs here is not a clinical rule.' }
    ] }
];
function astigType(E, c) {
  /* named from the eye's own error (distance, accommodation relaxed), not from where the rays land now:
     error < 0 = that meridian focuses in front of the retina, > 0 = behind */
  const pos = e => Math.abs(e) < 0.12 ? 0 : e < 0 ? -1 : 1;
  const a = pos(E.errV), b = pos(E.errH);
  const rule = E.s.Pv > E.s.Ph + 0.01 ? 'With the rule (vertical meridian steeper).' : E.s.Ph > E.s.Pv + 0.01 ? 'Against the rule (horizontal meridian steeper).' : '';
  let t;
  if (Math.abs(E.s.Pv - E.s.Ph) < 0.01) t = a === 0 ? 'Both meridians equal: no astigmatism.' : 'Both meridians equal: a spherical error, not astigmatism.';
  else if (a === 0 || b === 0) t = (a + b < 0 ? 'Simple myopic' : 'Simple hypermetropic') + ' astigmatism: one focal line on the retina.';
  else if (a === b) t = (a < 0 ? 'Compound myopic' : 'Compound hypermetropic') + ' astigmatism: both focal lines ' + (a < 0 ? 'in front of' : 'behind') + ' the retina.';
  else t = 'Mixed astigmatism: one focal line in front of the retina, one behind.';
  const fixed = c.fix && Math.abs(E.s.Pv - E.s.Ph) > 0.01 ? ' The cylindrical lens brings both focal lines onto the retina.' : '';
  return `${t} ${rule}${fixed}`;
}
const TEXT = {
  lede: 'Light from a distant object (or a near one) enters a schematic eye. Choose a condition, change the eye, and add a correcting lens or a pinhole to see where the rays focus and how blurred a letter becomes.',
  model: 'Model: a single-lens schematic eye of +60 D, focused for distance when relaxed; the correcting lens is treated as if it sat on the cornea, so its power is the contact-lens power. Each millimetre of length gives about 2.3–3.1 D here (about 2.6 D near normal length), close to the 2–3 D per mm the sources give. In this model an astigmatic eye accommodates to bring the midpoint between its two focal lines onto the retina (a modelling choice). Schematic, not to scale.',
  accom: [
    { k: 1, t: '<b>Mechanism (Helmholtz):</b> for near vision the ciliary muscle contracts, the zonules slacken, and the elastic lens rounds up, gaining power. For distance the muscle relaxes, the zonules tighten and the lens flattens. Accommodation is part of the near reflex, with convergence and constriction of the pupil, carried by parasympathetic fibres in the oculomotor nerve.' },
    { t: '<b>Amplitude falls with age</b>, roughly: about 13 D in adolescence, 10 D at 25, 6 D at 40, 2 D at 50 and 1 D at 60 (classic values; objective measurements give lower numbers). By the mid-40s the near point has moved beyond reading distance. Try the Presbyopia slider.' },
    { t: '<b>Anisometropia:</b> a difference between the two eyes, commonly defined as 1 D or more; a major cause of amblyopia in one eye, hypermetropic anisometropia more so. <b>Aniseikonia:</b> the images of the two eyes differ in size or shape, most often from glasses for anisometropia (roughly 1% per dioptre).' },
    { t: '<b>Aphakia:</b> the lens is absent (after cataract surgery, injury, dislocation or from birth). The eye becomes highly hypermetropic, needing strong plus lenses, and loses all accommodation.' }
  ],
  ambly: [
    { k: 1, t: '<b>Amblyopia:</b> reduced best-corrected vision in one eye (sometimes both) that cannot be explained solely by a structural abnormality of the eye. It comes from abnormal visual experience in early childhood.' },
    { t: '<b>Types:</b> strabismic (a squint); refractive, either anisometropic (unequal errors) or isoametropic (a high, similar error in both eyes); stimulus deprivation (congenital cataract, ptosis, corneal opacity); meridional (uncorrected astigmatism; not every source lists it as a separate type); mixed.' },
    { t: '<b>When:</b> the visual system is most sensitive in the first years of life; amblyopia can develop until about 7–10 years, and treatment still helps many children up to about 12.' },
    { t: '<b>Treatment:</b> first, full glasses for the refractive error; this alone often improves it. Then penalise the better eye: patching (about 2 hours a day for moderate and 6 hours for severe amblyopia; longer adds no benefit) or atropine drops, which work about as well for moderate amblyopia. Remove any cause of deprivation (cataract, ptosis) early. Overtreating the good eye can make <i>it</i> amblyopic (reverse amblyopia).' }
  ],
  surgery: [
    { k: 1, t: '<b>Laser surgery reshapes the cornea.</b> For myopia it flattens the centre of the cornea; for hypermetropia it steepens it.' },
    { t: '<b>LASIK:</b> a flap is cut (femtosecond laser or microkeratome) and the excimer laser reshapes the stroma beneath it. <b>PRK:</b> the surface epithelium is removed and the excimer laser works on the surface; no flap. <b>SMILE:</b> a femtosecond laser cuts a lens-shaped piece (lenticule) inside the stroma, removed through a 2–3 mm incision; no flap and no excimer laser.' },
    { w: 1, t: '<b>Safety limit:</b> after LASIK at least 250 µm of stroma must be left under the flap; many surgeons now prefer 300 µm. Corneas too thin for this, or errors too high for laser, can be treated with a <b>phakic IOL</b>: a lens implanted in addition to the eye\'s own lens, which needs an anterior chamber about 3 mm deep or more.' },
    { t: '<b>Pinhole test:</b> a pinhole lets through only a narrow central pencil of light, which deepens the focus and cuts the blur of any refractive error. If vision improves through a pinhole, an uncorrected refractive error is likely; if not, look for another cause (macular disease, media opacity, amblyopia). Try the Pinhole box above.' }
  ],
  foot: '<p><b>Based on:</b> StatPearls; EyeWiki (American Academy of Ophthalmology); International Myopia Institute reports (<i>IOVS</i> 2019, 2023); open-access reviews in <i>J Clin Med</i>, <i>Front Med</i> and others; Wikipedia.</p><p><b>Models used:</b> a single-lens schematic eye of +60 D (not the Gullstrand eye); the lens is treated as if on the cornea; ray heights enlarged; the letter blur is computed from the blur circle, not measured. Amplitudes of accommodation are approximate classic values.</p>'
};
/* ================= END DATA ================= */

const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const L0 = 1000 * EYE.n / EYE.P;  /* schematic (about 22.3 mm): only differences from it are shown */   // emmetropic axial length of the schematic eye, mm
const NEAR = 0.33;                 // reading distance, m

let cur = { c: 0, v: {}, fix: false, pin: false, near: false, cyclo: false };
const C = () => CONDS[cur.c];
const ampAt = age => { if (!AMP.length) return 0; let a = AMP[0]; for (const r of AMP) if (age >= r[0]) a = r; else break;
  const i = AMP.indexOf(a), b = AMP[i + 1]; if (!b) return a[1]; return a[1] + (b[1] - a[1]) * (age - a[0]) / (b[0] - a[0]); };

/* state of the eye from the condition and the sliders: axial length, power of each meridian, lens, accommodation */
function eyeState() {
  const c = C(), v = cur.v;
  const s = c.state(v);                                // {AL, Pv, Ph, age?}
  const vin = cur.near ? -1 / NEAR : 0;                // vergence of the light reaching the eye, D
  const need = m => 1000 * EYE.n / s.AL - m;           // total vergence needed at the cornea for focus on the retina
  // correcting lens (at the cornea, schematic): sphere and, for astigmatism, a cylinder
  let lensV = 0, lensH = 0;
  if (cur.fix) { lensV = need(s.Pv); lensH = need(s.Ph);
    if (c.key === 'presby') { const add = Math.max(0, 1 / NEAR - ampAt(s.age)); lensV = cur.near ? add : 0; lensH = lensV; } }
  // accommodation: the eye adds power (up to its amplitude) to bring the nearer meridian into focus; it cannot remove power
  const amp = cur.cyclo ? 0 : s.age != null ? ampAt(s.age) : 10;
  let A = 0;
  const shortfall = Math.min(need(s.Pv) - vin - lensV, need(s.Ph) - vin - lensH);  // positive = needs more plus
  const longfall = Math.max(need(s.Pv) - vin - lensV, need(s.Ph) - vin - lensH);
  if (c.accom !== false) A = Math.max(0, Math.min(amp, c.key === 'astig' ? (shortfall + longfall) / 2 : longfall));
  if (A < 0) A = 0;
  const foc = m => 1000 * EYE.n / (m);  // image distance (mm) for a vergence m just inside the cornea
  const mV = s.Pv + vin + lensV + A, mH = s.Ph + vin + lensH + A;
  return { s, vin, lensV, lensH, A, amp, fV: foc(mV), fH: foc(mH), errV: need(s.Pv), errH: need(s.Ph) };
}

/* blur circle on the retina (mm) for a focus at f with pupil p */
const blur = (f, AL, p) => p * Math.abs(AL - f) / Math.max(f, 1);

function drawRays(E) {
  const svg = $('rays'); svg.textContent = '';
  const X0 = 262, K = 12, Y0 = 130;   // cornea at x=262; 12 px per mm inside the eye
  const AL = E.s.AL, xr = X0 + AL * K;
  // globe
  el('path', { d: `M${X0} ${Y0 - 80} C ${X0 + 30} ${Y0 - 96} ${xr - 20} ${Y0 - 96} ${xr} ${Y0 - 40} L ${xr} ${Y0 + 40} C ${xr - 20} ${Y0 + 96} ${X0 + 30} ${Y0 + 96} ${X0} ${Y0 + 80} Q ${X0 - 22} ${Y0} ${X0} ${Y0 - 80} Z`, fill: 'var(--eye)', stroke: 'var(--muted)', 'stroke-width': 1 }, svg);
  el('line', { x1: xr, y1: Y0 - 46, x2: xr, y2: Y0 + 46, stroke: 'var(--retina)', 'stroke-width': 4, 'stroke-linecap': 'round' }, svg);
  const t = (x, y, s, a = 'middle') => { const e = el('text', { x, y, class: 'lbl', 'text-anchor': a }, svg); e.textContent = s; };
  t(X0 - 12, Y0 - 88, 'cornea'); t(xr, Y0 + 62, 'retina');
  // incoming rays
  const p = cur.pin ? EYE.pinhole : EYE.pupil, hs = [-1, -0.5, 0.5, 1].map(k => k * p / 2);
  const srcX = cur.near ? 40 : 0;
  const lensX = X0 - 18;   // drawn just in front of the cornea; treated as if on it
  if (cur.fix) { el('path', { d: lensShape(lensX, (E.lensV + E.lensH) / 2), fill: 'var(--lens)', opacity: .35, stroke: 'var(--lens)' }, svg); t(lensX, Y0 + 74, 'lens'); }
  if (cur.pin) { el('rect', { x: X0 - 52, y: Y0 - 70, width: 4, height: 70 - p * 7 * 2, fill: 'var(--ink)' }, svg); el('rect', { x: X0 - 52, y: Y0 + p * 7 * 2, width: 4, height: 70 - p * 7 * 2, fill: 'var(--ink)' }, svg); }
  /* astigmatism: the vertical meridian's rays are drawn above the axis, the horizontal meridian's below */
  const all = [-1, -2 / 3, -1 / 3, 1 / 3, 2 / 3, 1].map(k => k * p / 2);
  const fans = C().key === 'astig' ? [['fV', 'var(--m1)', all.filter(h => h > 0)], ['fH', 'var(--m2)', all.filter(h => h < 0)]] : [['fV', 'var(--ray)', hs]];
  for (const [f, col, hh] of fans) {
    const F = E[f];
    for (const h of hh) {
      const yC = Y0 - h * 7 * 4;     // ray heights at the cornea are drawn 4× (a 4 mm pupil would be hard to see)
      const yS = cur.near ? Y0 : yC;
      el('line', { x1: srcX, y1: yS, x2: X0, y2: yC, stroke: col, 'stroke-width': 1.4, opacity: .9 }, svg);
      const xf = X0 + F * K;
      // inside: straight line from (X0,yC) towards (xf,Y0); draw to the retina; if focus lies beyond, dash the rest
      const yAt = x => yC + (Y0 - yC) * (x - X0) / (xf - X0);
      el('line', { x1: X0, y1: yC, x2: xr, y2: yAt(xr), stroke: col, 'stroke-width': 1.4 }, svg);
      if (xf > xr) el('line', { x1: xr, y1: yAt(xr), x2: Math.min(xf, 596), y2: yAt(Math.min(xf, 596)), stroke: col, 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: .7 }, svg);
    }
    const xf = X0 + F * K;
    if (xf < 596) el('circle', { cx: xf, cy: Y0, r: 3.5, fill: 'var(--mark)' }, svg);
  }
  if (cur.near) { el('circle', { cx: srcX, cy: Y0, r: 3, fill: 'var(--ink)' }, svg); t(srcX, Y0 - 10, 'object'); }
  else t(20, Y0 - 70, 'from far away', 'start');
  t(8, 252, 'Schematic, not to scale: ray heights enlarged.', 'start');
}
function lensShape(x, P) {
  const h = 62, w = Math.min(14, 4 + Math.abs(P) * 0.9);
  if (P >= 0) return `M${x} ${130 - h} Q ${x + w} 130 ${x} ${130 + h} Q ${x - w} 130 ${x} ${130 - h} Z`;
  return `M${x - w / 2 - 2} ${130 - h} L ${x + w / 2 + 2} ${130 - h} Q ${x + 2} 130 ${x + w / 2 + 2} ${130 + h} L ${x - w / 2 - 2} ${130 + h} Q ${x - 2} 130 ${x - w / 2 - 2} ${130 - h} Z`;
}

function drawLetter(E) {
  const svg = $('letter'); svg.textContent = '';
  const p = cur.pin ? EYE.pinhole : EYE.pupil;
  const bV = blur(E.fV, E.s.AL, p), bH = blur(E.fH, E.s.AL, p);
  const sc = 18;   // px of blur per mm of blur circle (schematic)
  const f = el('filter', { id: 'bl', x: '-50%', y: '-50%', width: '200%', height: '200%' }, el('defs', {}, svg));
  // vertical-meridian rays spread the image up–down; horizontal ones spread it sideways
  el('feGaussianBlur', { stdDeviation: `${(bH * sc).toFixed(2)} ${(bV * sc).toFixed(2)}` }, f);
  el('rect', { x: -60, y: -60, width: 120, height: 120, fill: '#fff', rx: 8 }, svg);
  const g = el('g', { filter: 'url(#bl)', fill: '#111' }, svg);
  el('rect', { x: -30, y: -35, width: 60, height: 14 }, g);
  el('rect', { x: -30, y: -7, width: 50, height: 14 }, g);
  el('rect', { x: -30, y: 21, width: 60, height: 14 }, g);
  el('rect', { x: -30, y: -35, width: 14, height: 70 }, g);
}

var fmt = d => (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d).toFixed(2) + ' D';
function writeState(E) {
  const c = C(), s = E.s;
  const p = cur.pin ? EYE.pinhole : EYE.pupil;
  const where = f => Math.abs(f - s.AL) < 0.05 ? 'on the retina' : f < s.AL ? `${(s.AL - f).toFixed(1)} mm in front of the retina` : `${(f - s.AL).toFixed(1)} mm behind the retina`;
  let h = `<span class="tag">${c.name}</span><dl class="facts">`;
  const dL = s.AL - L0; h += `<dt>Eye length</dt><dd>${Math.abs(dL) < 0.05 ? 'normal' : (dL > 0 ? 'longer' : 'shorter') + ' by ' + Math.abs(dL).toFixed(1) + ' mm'}</dd>`;
  if (c.key === 'astig') h += `<dt>Vertical meridian</dt><dd>focus ${where(E.fV)}</dd><dt>Horizontal meridian</dt><dd>focus ${where(E.fH)}</dd>`;
  else h += `<dt>Focus</dt><dd>${where(E.fV)}</dd>`;
  if (s.age != null) h += `<dt>Accommodation</dt><dd class="num">${E.A.toFixed(1)} of ${E.amp.toFixed(1)} D used</dd>`;
  else if (E.A > 0.01) h += `<dt>Accommodation</dt><dd class="num">${E.A.toFixed(1)} D used</dd>`;
  if (cur.fix) h += c.key === 'astig'
    ? `<dt>Lens</dt><dd class="num">${fmt(E.lensV)} vertical, ${fmt(E.lensH)} horizontal</dd>`
    : `<dt>Lens</dt><dd class="num">${fmt(E.lensV)}</dd>`;
  h += `<dt>Blur circle</dt><dd class="num">${Math.max(blur(E.fV, s.AL, p), blur(E.fH, s.AL, p)).toFixed(2)} mm</dd></dl>`;
  if (c.say) h += `<p class="cap key">${c.say(E, cur)}</p>`;
  if (cur.cyclo && cur.near && c.key !== 'presby' && c.key !== 'hyp' && c.key !== 'emm' && Math.max(blur(E.fV, s.AL, p), blur(E.fH, s.AL, p)) > 0.02)
    h += `<p class="muted">Cycloplegic drops block accommodation, so the near object cannot be brought into focus.</p>`;
  $('state').innerHTML = h;
}

function controls() {
  const c = C(), box = $('ctl'); box.textContent = '';
  for (const k of c.sliders || []) {
    if (cur.v[k.id] == null) cur.v[k.id] = k.val;
    const lab = document.createElement('label'); lab.htmlFor = 's-' + k.id; lab.textContent = k.label;
    const r = document.createElement('input'); Object.assign(r, { type: 'range', id: 's-' + k.id, min: k.min, max: k.max, step: k.step, value: cur.v[k.id] });
    const o = document.createElement('output');
    const show = () => { o.textContent = k.fmt(+r.value); };
    r.oninput = () => { cur.v[k.id] = +r.value; show(); render(false); };
    show(); box.append(lab, r, o);
  }
  $('key').innerHTML = c.key === 'astig'
    ? `<span><i class="swatch" style="background:var(--m1)"></i>vertical meridian (rays above the axis)</span><span><i class="swatch" style="background:var(--m2)"></i>horizontal meridian (below)</span><span><i class="swatch" style="background:var(--mark)"></i>focus</span>`
    : `<span><i class="swatch" style="background:var(--ray)"></i>light rays</span><span><i class="swatch" style="background:var(--mark)"></i>focus</span><span><i class="swatch" style="background:var(--retina)"></i>retina</span>`;
  $('h-cond').textContent = c.name;
  $('about').innerHTML = c.about.map(x => `<p class="cap${x.k ? ' key' : x.w ? ' warn' : ''}">${x.t}</p>`).join('');
}
function render(full = true) {
  if (full) controls();
  $('conds').querySelectorAll('.chip').forEach((b, i) => b.setAttribute('aria-pressed', i === cur.c));
  const E = eyeState(); drawRays(E); drawLetter(E); writeState(E);
}
function init() {
  $('lede').innerHTML = TEXT.lede; $('model').innerHTML = TEXT.model;
  CONDS.forEach((c, i) => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = c.short;
    b.onclick = () => { cur.c = i; cur.v = {}; if (c.near != null) { cur.near = c.near; $('near').checked = c.near; } render(); }; $('conds').appendChild(b); });
  for (const id of ['fix', 'pin', 'near', 'cyclo']) $(id).onchange = e => { cur[id] = e.target.checked; render(false); };
  const list = a => a.map(x => `<p class="cap${x.k ? ' key' : x.w ? ' warn' : ''}">${x.t}</p>`).join('');
  $('accom').innerHTML = list(TEXT.accom); $('ambly').innerHTML = list(TEXT.ambly); $('surgery').innerHTML = list(TEXT.surgery);
  $('foot').innerHTML = TEXT.foot;
  render();
}
init();
</script>
</body>
</html>
